# ─────────────────────────────────────────────
#  Fuente (misma que EWW)
# ─────────────────────────────────────────────
font_family      CaskaydiaCove NF SemiBold
bold_font        CaskaydiaCove NF Bold
italic_font      CaskaydiaCove NF Italic
bold_italic_font CaskaydiaCove NF Bold Italic
font_size        13.0

# ─────────────────────────────────────────────
#  Colores base (tomados de tu eww.scss)
# ─────────────────────────────────────────────
background            #0b0b0e
foreground            #F2F2F2
selection_background  #F20505
selection_foreground  #F2F2F2
cursor                #F20505
cursor_text_color     #0b0b0e

# ─────────────────────────────────────────────
#  Ventana
# ─────────────────────────────────────────────
background_opacity    0.95
dynamic_background_opacity yes
hide_window_decorations yes
window_padding_width  12
window_margin_width   0
single_window_margin_width -1

# Bordes redondeados (necesita compositor con blur)
window_border_width   2
active_border_color   #F20505
inactive_border_color #6b6b72

# ─────────────────────────────────────────────
#  Tabs (estilo "pill" como tus workspaces)
# ─────────────────────────────────────────────
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_edge          top
tab_bar_margin_width  8
tab_bar_margin_height 6 6
tab_bar_min_tabs      2

active_tab_background   #F20505
active_tab_foreground   #F2F2F2
active_tab_font_style   bold
inactive_tab_background #0b0b0e
inactive_tab_foreground #6b6b72
tab_title_template      "{index}: {title}"

# ─────────────────────────────────────────────
#  Paleta ANSI (rojo protagonista, resto neutro)
# ─────────────────────────────────────────────
color0  #0b0b0e
color8  #6b6b72
color1  #F20505
color9  #F20519
color2  #a6e3a1
color10 #b8f0b4
color3  #f9e2af
color11 #fbe8c3
color4  #89b4fa
color12 #a5c7fc
color5  #cba6f7
color13 #dcc2fb
color6  #94e2d5
color14 #b0efe4
color7  #b0b0b5
color15 #F2F2F2

# ─────────────────────────────────────────────
#  Otros detalles
# ─────────────────────────────────────────────
enable_audio_bell no
window_alert_on_bell no
confirm_os_window_close 0
copy_on_select yes
scrollback_lines 10000
mouse_hide_wait 2.0

tab_bar_style custom
tab_bar_custom_script ~/.config/kitty/scripts/tab_bar.py